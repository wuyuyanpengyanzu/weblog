spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/weblog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: WeblogHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

decorator:
  datasource:
    p6spy:
      enable-logging: true
      log-format: "%(sql)"

mybatis-plus:
  # 关键：由于跨模块，必须使用 classpath* 来扫描依赖 jar 包或兄弟模块中的 XML 文件
  mapper-locations: classpath*:mapper/**/*.xml